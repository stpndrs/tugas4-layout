<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        .skeleton {
            background-color: #e0e0e0;
            background: linear-gradient(90deg,
                    #f0f0f0 30%,
                    #e0e0e0 60%,
                    #f0f0f0 90%);
            background-size: 200% 100%;
            border-radius: 8px;
            display: inline-block;
        }

        .skeleton-title {
            height: 1.75rem;
            width: 40%;
            margin-bottom: 0.5rem;
        }

        .skeleton-text {
            height: 1rem;
            margin-bottom: 0.5rem;
            width: 100%;
        }

        .skeleton-input {
            height: 38px;
            width: 100%;
            border-radius: 6px;
        }

        .skeleton-textarea {
            height: 90px;
            width: 100%;
            border-radius: 6px;
        }

        .skeleton-btn {
            height: 38px;
            width: 90px;
            border-radius: 6px;
        }

        .main-content {
            padding: 30px;
            max-width: 1100px;
            margin: 0 auto;
        }
    </style>
</head>

<body class="bg-light">
<div class="main-content">
        <div class="skeleton mb-4" style="height: 12px; width: 150px;"></div>

        <div class="skeleton skeleton-title d-block mb-4"></div>

        <div class="card shadow-sm border-0 p-4 bg-white">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <div class="skeleton skeleton-text mb-2" style="width: 40%;"></div>
                    <div class="skeleton skeleton-input"></div>
             </div>

                <div class="col-md-6 mb-3">
                    <div class="skeleton skeleton-text mb-2" style="width: 45%;"></div>
                    <div class="skeleton skeleton-input"></div>
                </div>

                <div class="col-md-6 mb-3">
                    <div class="skeleton skeleton-text mb-2" style="width: 50%;"></div>
                    <div class="skeleton skeleton-input"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <div class="skeleton skeleton-text mb-2" style="width: 45%;"></div>
                    <div class="skeleton skeleton-input"></div>
                </div>
                <div class="col-md-6 mb-4">
                    <div class="skeleton skeleton-text mb-2" style="width: 35%;"></div>
                    <div class="skeleton skeleton-input"></div>
                </div>
                <div class="col-md-6 mb-4">
                    <div class="skeleton skeleton-text mb-2" style="width: 25%;"></div>
                    <div class="skeleton skeleton-textarea"></div>
                </div>
            </div>
            <div class="d-flex gap-2 mt-2">
                <div class="skeleton skeleton-btn"></div>
                <div class="skeleton skeleton-btn" style="background-color: #d0d0d0;"></div>
            </div>
        </div>
    </div>
</body>

</html>
