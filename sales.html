    <style>
        .skeleton {
            background-color: #e0e0e0;
            background: linear-gradient(90deg,
                    #f0f0f0 25%,
                    #e0e0e0 50%,
                    #f0f0f0 75%);
            background-size: 200% 100%;
            border-radius: 4px;
            display: inline-block;
        }

        .skeleton-text {
            height: 1rem;
            margin-bottom: 0.5rem;
            width: 100%;
        }

        .skeleton-title {
            height: 1.75rem;
            width: 60%;
            margin-bottom: 0.5rem;
        }

        .skeleton-subtitle {
            height: 1rem;
            width: 40%;
        }

        .skeleton-btn {
            height: 38px;
            width: 100%;
            border-radius: 6px;
        }

        .skeleton-input {
            height: 38px;
            width: 100%;
            border-radius: 6px;
        }

        .skeleton-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px;
            background-color: #fff;
            height: 100%;
        }

        .skeleton-badge {
            height: 20px;
            width: 60px;
            border-radius: 12px;
        }
    </style>
</head>
